<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Password Recovery - Hashcat Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            padding-top: 50px;
            padding-bottom: 50px;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 25px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: #764ba2;
            background: #e9ecef;
            transform: scale(1.02);
        }
        .progress-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .password-found {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: white;
        }
        .hash-preview {
            font-family: monospace;
            font-size: 12px;
            background: #2d2d2d;
            color: #00ff00;
            padding: 10px;
            border-radius: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header text-center">
                        <i class="bi bi-wifi"></i> WiFi Password Recovery Tool
                        <br><small>Hashcat v6.2.5 - WPA/WPA2 (22000)</small>
                    </div>
                    <div class="card-body">
                        <!-- تبويبات -->
                        <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="file-tab" data-bs-toggle="tab" data-bs-target="#file" type="button" role="tab">
                                    <i class="bi bi-upload"></i> رفع ملف
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="text-tab" data-bs-toggle="tab" data-bs-target="#text" type="button" role="tab">
                                    <i class="bi bi-keyboard"></i> إدخال يدوي
                                </button>
                            </li>
                        </ul>
                        
                        <div class="tab-content">
                            <!-- تبويب رفع الملف -->
                            <div class="tab-pane fade show active" id="file" role="tabpanel">
                                <div id="dropZone" class="drop-zone">
                                    <i class="bi bi-cloud-upload" style="font-size: 48px;"></i>
                                    <h4 class="mt-3">اسحب وأفلت ملف .hc22000 هنا</h4>
                                    <p class="text-muted">أو انقر للاختيار</p>
                                    <input type="file" id="fileInput" accept=".hc22000,.txt" style="display: none;">
                                </div>
                            </div>
                            
                            <!-- تبويب إدخال يدوي -->
                            <div class="tab-pane fade" id="text" role="tabpanel">
                                <textarea id="hashInput" class="form-control" rows="5" placeholder="أدخل محتوى ملف .hc22000 هنا...&#10;مثال: WPA*02*082d5486a4e4b11d86d0459fd2fb0819*c4272865ed38*..."></textarea>
                                <button class="btn btn-custom mt-3 w-100" onclick="submitHash()">
                                    <i class="bi bi-play-fill"></i> بدء الهجوم
                                </button>
                            </div>
                        </div>
                        
                        <!-- منطقة عرض التقدم -->
                        <div id="progressArea" style="display: none;">
                            <div class="progress-card mt-4">
                                <h5><i class="bi bi-cpu"></i> جاري تنفيذ Hashcat...</h5>
                                <div class="progress mt-3">
                                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" 
                                         style="width: 0%; background: linear-gradient(90deg, #00b09b, #96c93d);"></div>
                                </div>
                                <div class="row mt-4">
                                    <div class="col-md-6">
                                        <p><strong><i class="bi bi-speedometer2"></i> السرعة:</strong> <span id="speed">0 H/s</span></p>
                                        <p><strong><i class="bi bi-clock"></i> الوقت المتبقي:</strong> <span id="timeRemaining">جاري الحساب...</span></p>
                                    </div>
                                    <div class="col-md-6">
                                        <p><strong><i class="bi bi-graph-up"></i> التقدم:</strong> <span id="progressPercent">0</span>%</p>
                                        <p><strong><i class="bi bi-thermometer-half"></i> GPU Temp:</strong> <span id="gpuTemp">--</span>°C</p>
                                    </div>
                                </div>
                                <button class="btn btn-danger mt-3" onclick="stopAttack()">
                                    <i class="bi bi-stop-fill"></i> إيقاف الهجوم
                                </button>
                            </div>
                        </div>
                        
                        <!-- منطقة عرض كلمة المرور -->
                        <div id="passwordArea" style="display: none;" class="mt-4">
                            <div class="alert alert-success text-center password-found">
                                <h4><i class="bi bi-key-fill"></i> تم العثور على كلمة المرور!</h4>
                                <h2 class="display-4" id="passwordDisplay"></h2>
                                <button class="btn btn-light mt-3" onclick="copyPassword()">
                                    <i class="bi bi-clipboard"></i> نسخ
                                </button>
                            </div>
                        </div>
                        
                        <!-- أزرار التحكم -->
                        <div class="mt-4 text-center">
                            <a href="/dashboard" class="btn btn-custom">
                                <i class="bi bi-speedometer2"></i> لوحة التحكم
                            </a>
                            <a href="/logs" class="btn btn-custom">
                                <i class="bi bi-file-text"></i> السجلات
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let socket = io();
        let currentTaskId = null;
        
        // إعدادات رفع الملف
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) uploadFile(e.target.files[0]);
        });
        
        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/api/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.task_id) {
                        currentTaskId = data.task_id;
                        subscribeToTask(currentTaskId);
                        showProgressArea();
                    }
                });
        }
        
        function submitHash() {
            const hashContent = document.getElementById('hashInput').value;
            if (!hashContent.trim()) {
                alert('الرجاء إدخال محتوى الهاش');
                return;
            }
            
            const formData = new FormData();
            formData.append('hash_content', hashContent);
            
            fetch('/api/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.task_id) {
                        currentTaskId = data.task_id;
                        subscribeToTask(currentTaskId);
                        showProgressArea();
                    }
                });
        }
        
        function subscribeToTask(taskId) {
            socket.emit('subscribe', taskId);
            
            // طلب الحالة الحالية
            fetch(`/api/task/${taskId}`)
                .then(res => res.json())
                .then(task => updateProgress(task));
        }
        
        socket.on('progress_update', (data) => {
            updateProgressBar(data.progress);
            document.getElementById('progressPercent').innerText = Math.round(data.progress);
        });
        
        socket.on('speed_update', (data) => {
            document.getElementById('speed').innerText = data.speed;
        });
        
        socket.on('time_update', (data) => {
            document.getElementById('timeRemaining').innerText = data.time;
        });
        
        socket.on('gpu_update', (data) => {
            document.getElementById('gpuTemp').innerText = data.temp;
        });
        
        socket.on('password_found', (data) => {
            document.getElementById('passwordDisplay').innerText = data.password;
            document.getElementById('passwordArea').style.display = 'block';
            document.getElementById('progressArea').style.display = 'none';
        });
        
        function updateProgressBar(percent) {
            const bar = document.getElementById('progressBar');
            bar.style.width = percent + '%';
            if (percent === 100) {
                bar.classList.remove('progress-bar-animated');
            }
        }
        
        function updateProgress(task) {
            if (task.progress) updateProgressBar(task.progress);
            if (task.speed) document.getElementById('speed').innerText = task.speed;
            if (task.time_remaining) document.getElementById('timeRemaining').innerText = task.time_remaining;
            if (task.gpu_temp) document.getElementById('gpuTemp').innerText = task.gpu_temp;
            if (task.password) {
                document.getElementById('passwordDisplay').innerText = task.password;
                document.getElementById('passwordArea').style.display = 'block';
                document.getElementById('progressArea').style.display = 'none';
            }
        }
        
        function showProgressArea() {
            document.getElementById('progressArea').style.display = 'block';
            document.getElementById('passwordArea').style.display = 'none';
        }
        
        function stopAttack() {
            fetch('/api/stop', { method: 'POST' })
                .then(() => alert('تم إيقاف الهجوم'));
        }
        
        function copyPassword() {
            const password = document.getElementById('passwordDisplay').innerText;
            navigator.clipboard.writeText(password);
            alert('تم نسخ كلمة المرور!');
        }
    </script>
</body>
</html>
