<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجلات النظام - Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        .logs-container {
            background: #0d1117;
            border-radius: 10px;
            padding: 20px;
            height: 80vh;
            overflow-y: auto;
            color: #00ff00;
        }
        .log-entry {
            font-family: 'Courier New', monospace;
            padding: 5px;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .log-info { color: #00ff00; }
        .log-warning { color: #ffff00; }
        .log-error { color: #ff0000; }
        .timestamp { color: #888; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wifi"></i> WiFi Password Recovery
            </a>
            <div>
                <a href="/" class="btn btn-outline-light me-2">
                    <i class="bi bi-house"></i> الرئيسية
                </a>
                <a href="/dashboard" class="btn btn-outline-light">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2 class="text-white mb-4"><i class="bi bi-file-text"></i> سجلات النظام (Live Logs)</h2>
        <div class="logs-container" id="logsContainer">
            <div class="text-center text-muted">جاري تحميل السجلات...</div>
        </div>
    </div>
    
    <script>
        let socket = io();
        
        function addLog(message, level) {
            const logsDiv = document.getElementById('logsContainer');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${level}`;
            const timestamp = new Date().toLocaleTimeString();
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> [${level.toUpperCase()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            
            // الاحتفاظ بآخر 500 سجل
            while (logsDiv.children.length > 500) {
                logsDiv.removeChild(logsDiv.firstChild);
            }
        }
        
        socket.on('new_log', (data) => {
            addLog(data.message, data.level);
        });
        
        // تحميل السجلات السابقة
        fetch('/api/logs')
            .then(res => res.json())
            .then(logs => {
                document.getElementById('logsContainer').innerHTML = '';
                logs.forEach(log => addLog(log.message, log.level));
            })
            .catch(() => {
                addLog('تم الاتصال بخادم السجلات', 'info');
            });
    </script>
</body>
</html>
